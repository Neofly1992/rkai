[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "rkai"
version = "0.1.0"
description = "Model acquisition, conversion and local execution for Rockchip platforms"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "MIT"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.28,<0.29",
    "pydantic>=2.12,<3",
    "python-multipart>=0.0.20,<1",
    "uvicorn>=0.34,<1",
]

[project.scripts]
rkai = "rkai.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.4,<10",
    "ruff>=0.14,<1",
    "onnx==1.16.1",
    "onnxruntime==1.23.2",
    "numpy==1.26.4",
    "Pillow==11.3.0",
    "tokenizers==0.22.1",
    "openai>=2,<3",
    "anthropic>=0.70,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
